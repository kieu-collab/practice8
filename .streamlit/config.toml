# Đặt file này tại: .streamlit/config.toml
# Dashboard dùng nền trắng cố định nên cần khóa theme sáng,
# nếu không một số chữ sẽ chìm khi người dùng bật dark mode.

[theme]
base = "light"
primaryColor = "#0d6efd"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f3f5"
textColor = "#212529"

[server]
maxMessageSize = 300
